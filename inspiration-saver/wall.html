<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspiration Wall</title>
<link rel="stylesheet" href="wall.css">
<script>
  try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
</script>
</head>
<body>
  <header>
    <h1>Inspiration</h1>
    <input id="search" type="search" placeholder="Search notes, titles, URLs…" aria-label="Search">
    <span id="count"></span>
    <button id="folderBtn" type="button">Choose folder</button>
    <button id="themeBtn" type="button" aria-label="Toggle theme">◐</button>
  </header>
  <div id="tags" aria-label="Tag filters"></div>
  <p id="empty" hidden></p>
  <main id="wall"></main>
  <div id="lightbox" hidden>
    <div class="lb-inner">
      <img id="lbImg" alt="">
      <div class="lb-info">
        <a id="lbTitle" target="_blank" rel="noopener"></a>
        <div id="lbNote"></div>
        <div id="lbMeta"></div>
        <button id="lbDelete" type="button">Delete</button>
      </div>
    </div>
  </div>
  <script type="module" src="wall.js"></script>
</body>
</html>
