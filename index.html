<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isaac Hartman — Coming Soon</title>
<meta name="description" content="The portfolio of Isaac Hartman is coming soon.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: 'Safiro';
  src: url('assets/fonts/safiro-regular-webfont.woff2') format('woff2'),
       url('assets/fonts/safiro-regular-webfont.woff') format('woff');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Safiro';
  src: url('assets/fonts/safiro-bold-webfont.woff2') format('woff2'),
       url('assets/fonts/safiro-bold-webfont.woff') format('woff');
  font-weight: 700; font-style: normal; font-display: swap;
}

:root {
  --font-head: 'Safiro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Lora', Georgia, 'Times New Roman', serif;
  --ink: #0e0e0d;
  --paper: #f7f5f0;
  --gutter: clamp(20px, 5vw, 64px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--ink);
  color: #fff;
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.bg {
  position: fixed; inset: 0;
  background: url('assets/images/hero-bg.webp') center / cover no-repeat;
  transform: scale(1.04);
  animation: settle 2.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.scrim {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, rgba(10,10,9,0.35) 0%, rgba(10,10,9,0.35) 35%, rgba(10,10,9,0.8) 100%);
}

main {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: var(--gutter);
}

.name {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.hero { max-width: 900px; margin-left: auto; text-align: right; }

.eyebrow {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.85;
  margin-bottom: 20px;
}

h1 {
  font-family: var(--font-head);
  font-weight: 400;
  font-size: clamp(2.6rem, 8vw, 6rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin-bottom: 22px;
}
h1 em {
  font-family: var(--font-body);
  font-style: italic;
  font-weight: 500;
}

.sub {
  font-size: clamp(1rem, 1.6vw, 1.2rem);
  max-width: 44ch;
  margin-left: auto;
  opacity: 0.92;
}

footer {
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 0.08em;
  opacity: 0.7;
}

.rise { opacity: 0; transform: translateY(14px); animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.45s; } .d4 { animation-delay: 0.6s; }

@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes settle { from { transform: scale(1.1); opacity: 0.6; } to { transform: scale(1.04); opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  .bg, .rise { animation: none; opacity: 1; transform: none; }
  .bg { transform: scale(1.04); }
}

@media (max-width: 640px) {
  .hero { text-align: left; margin-left: 0; }
  .sub { margin-left: 0; }
}
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <main>
    <div class="name rise d1">Isaac Hartman</div>

    <section class="hero">
      <p class="eyebrow rise d2">/Creative Portfolio</p>
      <h1 class="rise d3">Coming<br><em>soon.</em></h1>
      <p class="sub rise d4">A designer &amp; photographer's portfolio, currently being built. Check back shortly.</p>
    </section>

    <footer class="rise d4">&copy; <span id="y">2026</span> Isaac Hartman</footer>
  </main>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
