<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isaac Hartman — Coming Soon</title>
<meta name="description" content="The portfolio of Isaac Hartman is coming soon.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: 'Safiro';
  src: url('assets/fonts/safiro-regular-webfont.woff2') format('woff2'),
       url('assets/fonts/safiro-regular-webfont.woff') format('woff');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Safiro';
  src: url('assets/fonts/safiro-bold-webfont.woff2') format('woff2'),
       url('assets/fonts/safiro-bold-webfont.woff') format('woff');
  font-weight: 700; font-style: normal; font-display: swap;
}

:root {
  --font-head: 'Safiro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Lora', Georgia, 'Times New Roman', serif;
  --ink: #0e0e0d;
  --paper: #ffffff;
  --line: rgba(255, 255, 255, 0.35);
  --muted: rgba(255, 255, 255, 0.85);
  --ease: cubic-bezier(0.65, 0, 0.35, 1);
  --gutter: clamp(20px, 5vw, 64px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--ink);
  color: #fff;
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Full-screen photo behind the page, darkened for legibility */
.bg {
  position: fixed; inset: 0;
  background: url('assets/images/hero-bg.webp') center / cover no-repeat;
  transform: scale(1.04);
  animation: settle 2.4s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.scrim {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, rgba(10,10,9,0.5) 0%, rgba(10,10,9,0.5) 35%, rgba(10,10,9,0.8) 100%);
}

main {
  position: relative;
  z-index: 1;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 1400px;
  margin: 0 auto;
  padding: 30px var(--gutter) 0;
}

.name {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 20px;
  line-height: 20px;
  letter-spacing: -0.01em;
}
.name::before {
  content: '';
  width: 14px; height: 14px;
  border-radius: 50%;
  background: currentColor;
}

.hero { margin: auto 0; padding: 32px 0; }
.hero-head {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px 0;
  align-items: center;
}

h1 {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: clamp(2.6rem, 6vw, 5.5rem);
  line-height: 0.95;
  letter-spacing: -0.03em;
  text-wrap: balance;
}

.sub {
  padding-left: 40px;
  color: var(--muted);
  font-size: 15px;
  max-width: 46ch;
  border-left: 2px solid rgba(255, 255, 255, 0.6);
}

footer {
  border-top: 1px solid var(--line);
  padding: 24px 0 40px;
  font-family: var(--font-head);
  font-size: 13px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.rise { opacity: 0; transform: translateY(14px); animation: rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.d1 { animation-delay: 0.15s; } .d2 { animation-delay: 0.3s; } .d3 { animation-delay: 0.45s; } .d4 { animation-delay: 0.6s; }


.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin: 24px 0 0 42px;
  padding: 14px 26px;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink);
  background: #fff;
  border: 1px solid #fff;
  cursor: pointer;
  transition: background 0.3s var(--ease), color 0.3s var(--ease);
}
.btn:hover, .btn:focus-visible { background: transparent; color: #fff; }

.modal-overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  padding: var(--gutter);
  background: rgba(10,10,9,0.7);
  opacity: 0; visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
.modal-overlay.is-open { opacity: 1; visibility: visible; }
.modal {
  position: relative;
  width: 100%; max-width: 480px;
  max-height: 100%; overflow-y: auto;
  padding: 40px;
  background: var(--paper); color: var(--ink);
  transform: translateY(16px);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-overlay.is-open .modal { transform: none; }
.modal-close {
  position: absolute; top: 12px; right: 16px;
  background: none; border: 0; color: inherit;
  font-size: 28px; line-height: 1; cursor: pointer;
}
.tag {
  display: inline-block;
  font-family: var(--font-head); font-weight: 700;
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  background: var(--ink); color: var(--paper);
  padding: 5px 10px; margin-bottom: 14px;
}
.modal h2 {
  font-family: var(--font-head); font-weight: 700;
  font-size: 1.9rem; line-height: 1.05; letter-spacing: -0.01em; margin-bottom: 24px;
}
.form-row { margin-bottom: 16px; }
.form-row label {
  display: block; margin-bottom: 6px;
  font-family: var(--font-head); font-weight: 700;
  font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
}
.form-row input, .form-row textarea {
  width: 100%; padding: 12px 14px;
  font-family: var(--font-body); font-size: 1rem; color: var(--ink);
  background: #fff; border: 1px solid rgba(14,14,13,0.25); border-radius: 0;
}
.form-row input:focus, .form-row textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.hp { position: absolute; left: -9999px; }
.btn-send { width: 100%; margin: 8px 0 0; color: var(--paper); background: var(--ink); border-color: var(--ink); }
.btn-send:hover, .btn-send:focus-visible { background: transparent; color: var(--ink); }
.btn-send[disabled] { opacity: 0.6; cursor: wait; }
.form-note { min-height: 1.4em; margin-top: 14px; font-size: 0.95rem; }

@keyframes rise { to { opacity: 1; transform: none; } }
@keyframes settle { from { transform: scale(1.1); opacity: 0.6; } to { transform: scale(1.04); opacity: 1; } }

@media (max-width: 720px) {
  .hero-head { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .bg, .rise { animation: none; opacity: 1; transform: none; }
  .bg { transform: scale(1.04); }
}

</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="scrim" aria-hidden="true"></div>

  <main>
    <div class="name rise d1">Isaac Hartman</div>

    <section class="hero">
      <div class="hero-head">
        <h1 class="rise d2">/Coming<br>Soon</h1>
        <div class="hero-intro rise d3">
          <p class="sub">Portfolio under development, check back soon.</p>
          <button type="button" class="btn" id="contactOpen">Send me a message</button>
        </div>
      </div>
    </section>

    <footer class="rise d4">&copy; <span id="y">2026</span> Isaac Hartman</footer>
  </main>

  <div class="modal-overlay" id="contactModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
      <button class="modal-close" id="contactModalClose" aria-label="Close contact form">&times;</button>
      <p class="tag">Contact</p>
      <h2 id="contactModalTitle">Let's start something.</h2>
      <form id="contactForm" method="post">
        <div class="form-row">
          <label for="cf-name">Name</label>
          <input type="text" id="cf-name" name="name" required>
        </div>
        <div class="form-row">
          <label for="cf-email">Email</label>
          <input type="email" id="cf-email" name="email" required>
        </div>
        <div class="form-row">
          <label for="cf-message">Message</label>
          <textarea id="cf-message" name="message" rows="4" required></textarea>
        </div>
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" class="btn btn-send" id="cfSend">Send Message</button>
        <p class="form-note" id="formNote" role="status"></p>
      </form>
    </div>
  </div>

  <script>
document.getElementById('y').textContent = new Date().getFullYear();

  // Cloudflare Worker that emails the message (source: contact-worker/ on the dev branch)
  var FORM_ENDPOINT = 'https://contact-form.isaac-hartman.workers.dev';

  var modal = document.getElementById('contactModal');
  var form = document.getElementById('contactForm');
  var note = document.getElementById('formNote');
  var sendBtn = document.getElementById('cfSend');
  var openBtn = document.getElementById('contactOpen');

  function openModal() {
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    document.getElementById('cf-name').focus();
  }
  function closeModal() {
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    openBtn.focus();
  }
  openBtn.addEventListener('click', openModal);
  document.getElementById('contactModalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!FORM_ENDPOINT) {
      note.textContent = 'The contact form isn\u2019t connected yet \u2014 please check back shortly.';
      return;
    }
    sendBtn.disabled = true;
    note.textContent = 'Sending\u2026';
    fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(form)
    }).then(function (res) {
      if (!res.ok) throw new Error('bad response');
      form.reset();
      note.textContent = 'Thanks \u2014 your message was sent.';
    }).catch(function () {
      note.textContent = 'Something went wrong. Please try again.';
    }).then(function () { sendBtn.disabled = false; });
  });
</script>
</body>
</html>
